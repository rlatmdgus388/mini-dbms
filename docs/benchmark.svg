<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" font-family="sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="250" y="26" font-weight="bold">Mean query latency (log scale, lower is better)</text>
<line x1="250" y1="46" x2="250" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="250" y="250" text-anchor="middle" font-size="11" fill="#666666">1.00 µs</text>
<line x1="310" y1="46" x2="310" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="310" y="250" text-anchor="middle" font-size="11" fill="#666666">10.00 µs</text>
<line x1="370" y1="46" x2="370" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="370" y="250" text-anchor="middle" font-size="11" fill="#666666">100.00 µs</text>
<line x1="430" y1="46" x2="430" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="430" y="250" text-anchor="middle" font-size="11" fill="#666666">1.00 ms</text>
<line x1="490" y1="46" x2="490" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="490" y="250" text-anchor="middle" font-size="11" fill="#666666">10.00 ms</text>
<line x1="550" y1="46" x2="550" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="550" y="250" text-anchor="middle" font-size="11" fill="#666666">100.00 ms</text>
<line x1="610" y1="46" x2="610" y2="234" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="610" y="250" text-anchor="middle" font-size="11" fill="#666666">1000.00 ms</text>
<text x="240" y="70" text-anchor="end">WHERE id = ? (point)</text>
<rect x="250" y="54" width="38.4967" height="26" fill="#2a7de1"/>
<text x="296.497" y="72">4.38 µs (INDEX)</text>
<text x="240" y="116" text-anchor="end">WHERE id BETWEEN (1000 rows)</text>
<rect x="250" y="100" width="185.439" height="26" fill="#2a7de1"/>
<text x="443.439" y="118">1.23 ms (INDEX)</text>
<text x="240" y="162" text-anchor="end">WHERE email = ? (point)</text>
<rect x="250" y="146" width="290.925" height="26" fill="#e1572a"/>
<text x="548.925" y="164">70.59 ms (SCAN)</text>
<text x="240" y="208" text-anchor="end">WHERE age = ? (~1% rows)</text>
<rect x="250" y="192" width="290.734" height="26" fill="#e1572a"/>
<text x="548.734" y="210">70.08 ms (SCAN)</text>
</svg>
