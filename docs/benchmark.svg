<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" font-family="sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="250" y="26" font-weight="bold">Mean query latency (log scale, lower is better)</text>
<text x="240" y="70" text-anchor="end">WHERE id = ? (point)</text>
<rect x="250" y="54" width="18.1657" height="26" fill="#2a7de1"/>
<text x="276.166" y="72">1.79 µs (INDEX)</text>
<text x="240" y="116" text-anchor="end">WHERE id BETWEEN (1000 rows)</text>
<rect x="250" y="100" width="200.058" height="26" fill="#2a7de1"/>
<text x="458.058" y="118">600.60 µs (INDEX)</text>
<text x="240" y="162" text-anchor="end">WHERE email = ? (point)</text>
<rect x="250" y="146" width="325.909" height="26" fill="#e1572a"/>
<text x="583.909" y="164">33.61 ms (SCAN)</text>
<text x="240" y="208" text-anchor="end">WHERE age = ? (~1% rows)</text>
<rect x="250" y="192" width="326.166" height="26" fill="#e1572a"/>
<text x="584.166" y="210">33.89 ms (SCAN)</text>
</svg>
